services:
  plc:
    build: ./plc
    container_name: plc
    cap_add: [NET_ADMIN]
    ports: ["8080:8080"]
    networks:
      ot: {ipv4_address: 172.28.0.10}
  hmi:
    image: python:3.11-slim
    container_name: hmi
    command: sleep infinity
    volumes: ["./scripts:/scripts"]
    networks:
      ot: {ipv4_address: 172.28.0.20}
  attacker:
    image: python:3.11-slim
    container_name: attacker
    command: sleep infinity
    volumes: ["./scripts:/scripts"]
    networks:
      ot: {ipv4_address: 172.28.0.30}
  ids:
    image: jasonish/suricata:latest
    container_name: ids
    network_mode: "service:plc"
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    # -S loads ONLY our rules; --set turns ON Modbus inspection (off by default in Suricata)
    command: -i eth0 -S /etc/suricata/rules/local.rules --set app-layer.protocols.modbus.enabled=yes
    volumes:
      - ./suricata/local.rules:/etc/suricata/rules/local.rules
      - ./suricata/logs:/var/log/suricata
    depends_on: [plc]
networks:
  ot:
    ipam:
      config: [{subnet: 172.28.0.0/24}]
